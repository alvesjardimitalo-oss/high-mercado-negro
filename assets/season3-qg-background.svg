 <filter id="neon"><feGaussianBlur stdDeviation="5" result="halo"/><feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#000" flood-opacity=".8"/></filter>
