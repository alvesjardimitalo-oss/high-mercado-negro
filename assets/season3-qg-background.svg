 <linearGradient id="lightPink" x2="1" y2="1"><stop stop-color="#f040d0"/><stop offset="1" stop-color="#6f276e"/></linearGradient>
 <radialGradient id="greenGlow"><stop stop-color="#a0f040" stop-opacity=".48"/><stop offset=".35" stop-color="#79fa35" stop-opacity=".21"/><stop offset="1" stop-color="#79fa35" stop-opacity="0"/></radialGradient>
 <radialGradient id="pinkGlow"><stop stop-color="#f040d0" stop-opacity=".38"/><stop offset="1" stop-color="#f040d0" stop-opacity="0"/></radialGradient>
